services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: station
      POSTGRES_DB: station
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "apps/worker/dist/migrate.js"]
    environment: &runtime_env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STATION_MASTER_KEY: ${STATION_MASTER_KEY:?Set STATION_MASTER_KEY in .env}
      APP_PORT: 8080
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      APP_TLS_KEY_PATH: ${APP_TLS_KEY_PATH:-}
      APP_TLS_CERT_PATH: ${APP_TLS_CERT_PATH:-}
      APP_TRUSTED_PROXY_IP: ${APP_TRUSTED_PROXY_IP:-}
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      PRIVATE_BLOB_DIR: /var/lib/station/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  blob-init:
    build: .
    user: "0:0"
    entrypoint: ["sh", "-eu", "-c"]
    command: ["case \"$$BLOB_GID\" in *[!0-9]*|'') exit 1;; esac; install -d -m 2770 -o 0 -g \"$$BLOB_GID\" /var/lib/station/blobs; chown 0:\"$$BLOB_GID\" /var/lib/station/blobs; chmod 2770 /var/lib/station/blobs"]
    environment:
      BLOB_GID: ${APP_GID:-1000}
    volumes:
      - private_blobs:/var/lib/station/blobs
    restart: "no"

  app:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment: *runtime_env
    env_file:
      - ./.cache/go-camo.env
    volumes:
      - ./.cache/tls:/run/tls:ro
      - private_blobs:/var/lib/station/blobs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - default
      - camo_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      blob-init:
        condition: service_completed_successfully
      go-camo:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const s=process.env.APP_TLS_CERT_PATH?'https':'http';require(s).get(s+'://127.0.0.1:8080/ready',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/main.js"]
    environment: *runtime_env
    group_add:
      - "${APP_GID:-1000}"
    volumes:
      - private_blobs:/var/lib/station/blobs
    networks:
      - default
      - mail_parser
    depends_on:
      migrate:
        condition: service_completed_successfully
      blob-init:
        condition: service_completed_successfully
      mime-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/health.js"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  mime-parser:
    build: .
    command: ["node", "apps/worker/dist/mail-parser-service.js"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks:
      - mail_parser
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  go-camo:
    image: ghcr.io/cactus/go-camo:v2.7.7@sha256:5a62e8af42cee15fd47b486d4e4df3ecfed3c7fc0e9e4c625f3816ba17c65677
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ./.cache/go-camo.env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    command: ["--listen=0.0.0.0:8080", "--max-size=4096", "--timeout=4s", "--max-redirects=0", "--no-debug-vars"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - camo_egress
    restart: unless-stopped

  meili-init:
    profiles: [search]
    build: .
    user: "0:0"
    entrypoint: ["sh", "-eu", "-c"]
    command: ["install -d -m 700 -o 1000 -g 1000 /meili_data; chown 1000:1000 /meili_data; chmod 700 /meili_data"]
    volumes:
      - meili_data:/meili_data
    network_mode: none
    restart: "no"

  meilisearch:
    profiles: [search]
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    user: "1000:1000"
    env_file:
      - ./.cache/meilisearch.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_MAX_INDEXING_MEMORY: 256 MiB
      MEILI_MAX_INDEXING_THREADS: "2"
    volumes:
      - meili_data:/meili_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    networks:
      - search_internal
    depends_on:
      meili-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  meili-bootstrap:
    profiles: [search]
    build: .
    command: ["node", "packages/search/dist/meili-bootstrap.js"]
    env_file:
      - ./.cache/meilisearch.env
    environment:
      MEILI_HOST: http://meilisearch:7700
    networks:
      - search_internal
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: "no"

  search-contract:
    build: .
    command: ["node", "tests/integration/meili-contract.mjs"]
    env_file:
      - ./.cache/meilisearch.env
    environment:
      MEILI_HOST: http://meilisearch:7700
    networks:
      - search_internal
    profiles:
      - fixture
    restart: "no"

networks:
  mail_parser:
    internal: true
  camo_egress:
  search_internal:
    internal: true

volumes:
  postgres_data:
  private_blobs:
  meili_data:
