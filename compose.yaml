services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: station
      POSTGRES_DB: station
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "apps/worker/dist/migrate.js"]
    environment: &runtime_env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STATION_MASTER_KEY: ${STATION_MASTER_KEY:?Set STATION_MASTER_KEY in .env}
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *runtime_env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/main.js"]
    environment: *runtime_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/health.js"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
