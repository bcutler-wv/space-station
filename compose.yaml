services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: station
      POSTGRES_DB: station
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "apps/worker/dist/migrate.js"]
    environment: &runtime_env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STATION_MASTER_KEY: ${STATION_MASTER_KEY:?Set STATION_MASTER_KEY in .env}
      APP_PORT: 8080
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      APP_TLS_KEY_PATH: ${APP_TLS_KEY_PATH:-}
      APP_TLS_CERT_PATH: ${APP_TLS_CERT_PATH:-}
      APP_TRUSTED_PROXY_IP: ${APP_TRUSTED_PROXY_IP:-}
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      PRIVATE_BLOB_DIR: /var/lib/station/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  blob-init:
    build: .
    user: "0:0"
    entrypoint: ["sh", "-eu", "-c"]
    command: ["case \"$$BLOB_GID\" in *[!0-9]*|'') exit 1;; esac; install -d -m 2770 -o 0 -g \"$$BLOB_GID\" /var/lib/station/blobs; chown 0:\"$$BLOB_GID\" /var/lib/station/blobs; chmod 2770 /var/lib/station/blobs"]
    environment:
      BLOB_GID: ${APP_GID:-1000}
    volumes:
      - private_blobs:/var/lib/station/blobs
    restart: "no"

  app:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment: *runtime_env
    env_file:
      - ./.cache/go-camo.env
    volumes:
      - ./.cache/tls:/run/tls:ro
      - private_blobs:/var/lib/station/blobs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - default
      - camo_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      blob-init:
        condition: service_completed_successfully
      go-camo:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const s=process.env.APP_TLS_CERT_PATH?'https':'http';require(s).get(s+'://127.0.0.1:8080/ready',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/main.js"]
    environment: *runtime_env
    group_add:
      - "${APP_GID:-1000}"
    volumes:
      - private_blobs:/var/lib/station/blobs
    networks:
      - default
      - mail_parser
    depends_on:
      migrate:
        condition: service_completed_successfully
      blob-init:
        condition: service_completed_successfully
      mime-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/health.js"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  mime-parser:
    build: .
    command: ["node", "apps/worker/dist/mail-parser-service.js"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks:
      - mail_parser
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  go-camo:
    image: ghcr.io/cactus/go-camo:v2.7.7@sha256:5a62e8af42cee15fd47b486d4e4df3ecfed3c7fc0e9e4c625f3816ba17c65677
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ./.cache/go-camo.env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    command: ["--listen=0.0.0.0:8080", "--max-size=4096", "--timeout=4s", "--max-redirects=0", "--no-debug-vars"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - camo_egress
    restart: unless-stopped

  search-init:
    profiles: [search]
    build: .
    user: "0:0"
    entrypoint: ["sh", "/app/ops/opensearch/install-private.sh"]
    environment:
      SEARCH_APP_GID: ${APP_GID:-1000}
    volumes:
      - ./.cache/search-security:/source:ro
      - opensearch_data:/search-data
      - opensearch_config:/search-config
      - search_security_state:/state
      - search_node_certs:/node
      - search_admin_certs:/admin
      - search_query_certs:/query
      - search_indexer_certs:/indexer
      - search_outsider_certs:/outsider
    network_mode: none
    restart: "no"

  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    user: "1000:1000"
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - opensearch_config:/usr/share/opensearch/config
      - search_node_certs:/usr/share/opensearch/config/station-certs:ro
      - ./ops/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    # The official image can write its keystore/config in a private volume;
    # the image root stays read-only. Compatibility is proved in Ubuntu CI.
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=128m
      - /usr/share/opensearch/logs:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    networks:
      - search_internal
    depends_on:
      search-init:
        condition: service_completed_successfully
    restart: unless-stopped

  search-security-bootstrap:
    profiles: [search]
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/run/station-bootstrap/bootstrap-security.sh"]
    volumes:
      - search_admin_certs:/run/station-admin:ro
      - search_security_state:/run/station-state
      - ./ops/opensearch/security:/run/station-security-config:ro
      - ./ops/opensearch/bootstrap-security.sh:/run/station-bootstrap/bootstrap-security.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - search_internal
    depends_on:
      opensearch:
        condition: service_started
    restart: "no"

  search-profile-bootstrap:
    profiles: [search]
    build: .
    user: "1000:1000"
    command: ["node", "packages/search/dist/opensearch-bootstrap.js"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_IDENTITY_DIR: /run/station-admin
    volumes:
      - search_admin_certs:/run/station-admin:ro
    networks:
      - search_internal
    depends_on:
      search-security-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  search-contract:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["node", "tests/integration/opensearch-contract.mjs"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
    networks:
      - search_internal
    volumes:
      - search_query_certs:/run/station-query:ro
      - search_indexer_certs:/run/station-indexer:ro
      - search_outsider_certs:/run/station-outsider:ro
    profiles:
      - fixture
    depends_on:
      search-profile-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  search-profile-drift:
    profiles: [fixture]
    build: .
    user: "1000:1000"
    group_add:
      - "${APP_GID:-1000}"
    command: ["node", "tests/integration/opensearch-profile-drift.mjs"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
    networks:
      - search_internal
    volumes:
      - search_admin_certs:/run/station-admin:ro
      - search_query_certs:/run/station-query:ro
    restart: "no"

  search-generation-proof:
    profiles: [fixture]
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "1000"
    command: ["node", "tests/integration/opensearch-generation-proof.mjs"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
    networks:
      - search_internal
    volumes:
      - search_admin_certs:/run/station-admin:ro
      - search_query_certs:/run/station-query:ro
      - search_indexer_certs:/run/station-indexer:ro
      - ./.cache/search-generations/11111111111141118111111111111111:/run/generation-a:ro
      - ./.cache/search-generations/22222222222242228222222222222222:/run/generation-b:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: "no"

networks:
  mail_parser:
    internal: true
  camo_egress:
  search_internal:
    internal: true

volumes:
  postgres_data:
  private_blobs:
  opensearch_data:
  opensearch_config:
  search_node_certs:
  search_admin_certs:
  search_security_state:
  search_query_certs:
  search_indexer_certs:
  search_outsider_certs:
