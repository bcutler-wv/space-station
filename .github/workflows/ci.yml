name: CI
on:
  push:
  pull_request:
jobs:
  search-admin-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scaffold
    env:
      # Disposable fixture owner password; no production database is contacted.
      POSTGRES_PASSWORD: fixture-only-pg16-owner-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/search-admin-roles-gate.sh
      - run: bash scripts/search-admin-credentials-gate.sh

  search-admin-db-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scaffold
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tests/integration/search-admin-db-jobs.mjs
      - run: bash scripts/search-admin-db-jobs-gate.sh

  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - run: node tests/integration/search-generation-identity.mjs
      - run: node tests/integration/mail-parser.mjs
      - run: node tests/integration/mail-sanitize.mjs
      - run: node tests/integration/node-version.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright test --config playwright.mail-body-dev.config.ts

  process-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scaffold
    env:
      APP_UID: '1001'
      APP_GID: '1001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/init-env.mjs
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm -T --no-deps blob-init
      - run: docker compose run --rm -T migrate
      - run: docker compose exec -T postgres createdb -U station station_process_recovery_test
      - run: docker compose run --rm -T -e DB_NAME=station_process_recovery_test migrate
      - run: mkdir -p .cache/results/process-recovery
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_process_recovery_test -e STATION_TEST_BLOB_ROOT=/var/lib/station/blobs/process-recovery-fixture -e PROCESS_RECOVERY_ARTIFACT_ROOT=/run/process-results -v "$PWD/.cache/results/process-recovery:/run/process-results" app node tests/integration/process-recovery.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-recovery-logs
          path: .cache/results/process-recovery/*.log
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v --remove-orphans

  opensearch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: scaffold
    env:
      APP_UID: '1001'
      APP_GID: '1001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: node scripts/init-env.mjs
      - run: node scripts/init-search-security.mjs
      - run: node scripts/init-search-generation-identity.mjs 11111111-1111-4111-8111-111111111111
      - run: node scripts/init-search-generation-identity.mjs 22222222-2222-4222-8222-222222222222
      - run: mkdir -p .cache/results
      - run: node tests/support/opensearch-generation-collections.test.mjs && node tests/support/opensearch-generation-container.test.mjs
      - run: docker compose --profile search --profile fixture build search-init search-profile-bootstrap search-contract search-profile-drift search-generation-proof
      - run: docker compose --profile search run --rm -T --no-deps search-init
      - run: docker compose --profile search up -d --no-deps opensearch
      - run: bash scripts/opensearch-container-gate.sh
      - run: docker compose --profile search run --rm -T --no-deps search-security-bootstrap
      - run: docker compose --profile search run --rm -T --no-deps search-profile-bootstrap
      - run: docker compose --profile search run --rm -T --no-deps search-security-bootstrap
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_CONTRACT_PHASE=initial search-contract
      - run: docker compose --profile search restart opensearch
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_CONTRACT_PHASE=ready search-contract
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_CONTRACT_PHASE=retained search-contract
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_DRIFT_PHASE=profile search-profile-drift
      - run: '! docker compose --profile search run --rm -T --no-deps search-profile-bootstrap'
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_DRIFT_PHASE=restore search-profile-drift
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_DRIFT_PHASE=shadow search-profile-drift
      - run: docker compose --profile search run --rm -T --no-deps search-security-bootstrap
      - run: '! docker compose --profile search run --rm -T --no-deps search-profile-bootstrap'
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_DRIFT_PHASE=shadow-restore search-profile-drift
      - run: docker compose --profile search run --rm -T --no-deps search-profile-bootstrap
      - run: bash scripts/opensearch-generation-proof-gate.sh
      - run: docker compose --profile search --profile fixture run --rm -T --no-deps -e SEARCH_DRIFT_PHASE=role search-profile-drift
      - run: docker compose --profile search run --rm -T --no-deps search-security-bootstrap
      - run: '! docker compose --profile search run --rm -T --no-deps search-profile-bootstrap'
      - if: always()
        run: |
          mkdir -p .cache/results
          docker compose --profile search logs --no-color --tail=100 opensearch search-security-bootstrap search-profile-bootstrap > .cache/results/opensearch-tail.log 2>&1 || true
          tail -c 65536 .cache/results/opensearch-tail.log > .cache/results/opensearch-tail-bounded.log
          mv .cache/results/opensearch-tail-bounded.log .cache/results/opensearch-tail.log
          node scripts/check-search-logs.mjs .cache/results/opensearch-tail.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opensearch-runtime-failure
          path: .cache/results/opensearch-tail.log
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile search --profile fixture down -v --remove-orphans

  m1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scaffold
    env:
      APP_UID: '1001'
      APP_GID: '1001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/init-env.mjs
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm -T --no-deps blob-init
      - run: docker compose run --rm -T migrate
      - run: docker compose exec -T postgres createdb -U station station_m1_browser_test
      - run: docker compose run --rm -T -e DB_NAME=station_m1_browser_test migrate
      - run: mkdir -p .cache/bootstrap .cache/results/m1-browser
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_m1_browser_test -v "$PWD/.cache/bootstrap:/run/bootstrap" app node apps/server/dist/bootstrap-cli.js /run/bootstrap/m1-browser-token
      - run: docker compose run -d --name station-m1-browser-app --no-deps -p 127.0.0.1:8084:8080 -p 127.0.0.1:8094:8091 -e DB_NAME=station_m1_browser_test -e APP_ORIGIN=https://localhost:8084 -e STATION_TEST_BLOB_ROOT=/var/lib/station/blobs/m1-browser-fixture -e M1_BROWSER_ARTIFACT_ROOT=/run/m1-results -e M1_BROWSER_CONTROL_HOST=0.0.0.0 -v "$PWD/.cache/results/m1-browser:/run/m1-results" app node tests/support/m1-browser-supervisor.mjs
      - run: curl --insecure --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 60 --retry-all-errors --connect-timeout 2 --max-time 5 https://localhost:8084/ready >/dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/integration/m1-browser.mjs
        env:
          STATION_M1_BROWSER_BASE_URL: https://localhost:8084
          STATION_M1_BROWSER_CONTROL_URL: http://localhost:8094
          STATION_M1_BROWSER_BOOTSTRAP_PATH: .cache/bootstrap/m1-browser-token
          M1_BROWSER_HOST_ARTIFACT_ROOT: .cache/results/m1-browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-browser-evidence
          path: .cache/results/m1-browser/*
          if-no-files-found: ignore
      - if: always()
        run: docker rm -f station-m1-browser-app || true
      - if: always()
        run: docker compose down -v --remove-orphans

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scaffold
    env:
      APP_UID: '1001'
      APP_GID: '1001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/compose-smoke.sh
      - run: bash scripts/private-blob-container-gate.sh
      - run: bash scripts/mail-parser-container-gate.sh
      - run: docker compose exec -T postgres createdb -U station station_auth_test
      - run: docker compose run --rm -T -e DB_NAME=station_auth_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_auth_test app node tests/integration/auth-db.mjs
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_auth_test app node tests/integration/setup-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_google_test
      - run: docker compose run --rm -T -e DB_NAME=station_google_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_google_test app node tests/integration/google-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_mail_page_test
      - run: docker compose run --rm -T -e DB_NAME=station_mail_page_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_mail_page_test app node tests/integration/mail-page-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_ledger_test
      - run: docker compose run --rm -T -e DB_NAME=station_search_ledger_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_search_ledger_test app node tests/integration/search-ledger-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_test
      - run: docker compose run --rm -T -e DB_NAME=station_search_generation_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_search_generation_test app node tests/integration/search-generation-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_upgrade_test
      - run: mkdir -p .cache/results/search-generation-upgrade
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_search_generation_upgrade_test -e SEARCH_GENERATION_UPGRADE_FOLDER=/app/.cache/results/search-generation-upgrade -v "$PWD/.cache/results/search-generation-upgrade:/app/.cache/results/search-generation-upgrade" app node tests/integration/search-generation-upgrade.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_invalid_ack_test
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_search_generation_invalid_ack_test -e SEARCH_GENERATION_UPGRADE_FOLDER=/app/.cache/results/search-generation-upgrade -e SEARCH_GENERATION_UPGRADE_INVALID_ACK=1 -v "$PWD/.cache/results/search-generation-upgrade:/app/.cache/results/search-generation-upgrade" app node tests/integration/search-generation-upgrade.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_admin_test
      - run: docker compose run --rm -T -e DB_NAME=station_search_generation_admin_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_search_generation_admin_test app node tests/integration/search-generation-admin-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_admin_upgrade_test
      - run: mkdir -p .cache/results/search-generation-admin-upgrade
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_search_generation_admin_upgrade_test -e SEARCH_GENERATION_ADMIN_UPGRADE_FOLDER=/app/.cache/results/search-generation-admin-upgrade -v "$PWD/.cache/results/search-generation-admin-upgrade:/app/.cache/results/search-generation-admin-upgrade" app node tests/integration/search-generation-admin-upgrade.mjs
      - run: docker compose exec -T postgres createdb -U station station_search_generation_admin_invalid_test
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_search_generation_admin_invalid_test -e SEARCH_GENERATION_ADMIN_UPGRADE_FOLDER=/app/.cache/results/search-generation-admin-upgrade -e SEARCH_GENERATION_ADMIN_UPGRADE_INVALID=1 -v "$PWD/.cache/results/search-generation-admin-upgrade:/app/.cache/results/search-generation-admin-upgrade" app node tests/integration/search-generation-admin-upgrade.mjs
      - run: docker compose exec -T postgres createdb -U station station_drafts_test
      - run: docker compose run --rm -T -e DB_NAME=station_drafts_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_drafts_test app node tests/integration/drafts-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_draft_attachments_test
      - run: docker compose run --rm -T -e DB_NAME=station_draft_attachments_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_draft_attachments_test -e ATTACHMENT_TEST_BLOB_ROOT=/var/lib/station/blobs/draft-attachment-fixture app node tests/integration/draft-attachments-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_send_test
      - run: docker compose run --rm -T -e DB_NAME=station_send_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_send_test -e SEND_TEST_BLOB_ROOT=/var/lib/station/blobs/send-fixture app node tests/integration/send-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_mail_change_test
      - run: docker compose run --rm -T -e DB_NAME=station_mail_change_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_mail_change_test app node tests/integration/mail-change-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_gmail_sync_test
      - run: docker compose run --rm -T -e DB_NAME=station_gmail_sync_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_gmail_sync_test app node tests/integration/gmail-sync-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_sync_events_test
      - run: docker compose run --rm -T -e DB_NAME=station_sync_events_test migrate
      - run: docker compose run --rm -T --no-deps -e DB_NAME=station_sync_events_test app node tests/integration/sync-events-db.mjs
      - run: docker compose exec -T postgres createdb -U station station_mail_reader_test
      - run: docker compose run --rm -T -e DB_NAME=station_mail_reader_test migrate
      - run: bash scripts/go-camo-container-gate.sh
      - run: docker compose exec -T postgres createdb -U station station_google_browser_test
      - run: docker compose run --rm -T -e DB_NAME=station_google_browser_test migrate
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_google_browser_test -v "$PWD/.cache/bootstrap:/run/bootstrap" app node apps/server/dist/bootstrap-cli.js /run/bootstrap/google-browser-token
      - run: docker compose run -d --name station-google-browser-app --no-deps -p 127.0.0.1:8083:8080 -e DB_NAME=station_google_browser_test -e APP_ORIGIN=https://localhost:8083 app node tests/support/google-browser-server.mjs
      - run: curl --insecure --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 60 --retry-all-errors --connect-timeout 2 --max-time 5 https://localhost:8083/ready >/dev/null
      - run: docker compose exec -T postgres createdb -U station station_passkey_test
      - run: docker compose run --rm -T -e DB_NAME=station_passkey_test migrate
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_passkey_test -v "$PWD/.cache/bootstrap:/run/bootstrap" app node apps/server/dist/bootstrap-cli.js /run/bootstrap/passkey-token
      - run: docker compose run -d --name station-passkey-app --no-deps -p 127.0.0.1:8081:8080 -e DB_NAME=station_passkey_test -e APP_ORIGIN=https://localhost:8081 app
      - run: curl --insecure --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 60 --retry-all-errors --connect-timeout 2 --max-time 5 https://localhost:8081/ready >/dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/integration/passkey-browser.mjs
        env:
          STATION_PASSKEY_BASE_URL: https://localhost:8081
          STATION_PASSKEY_BOOTSTRAP_PATH: .cache/bootstrap/passkey-token
      - run: docker compose exec -T postgres createdb -U station station_password_test
      - run: docker compose run --rm -T -e DB_NAME=station_password_test migrate
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -e DB_NAME=station_password_test -v "$PWD/.cache/bootstrap:/run/bootstrap" app node apps/server/dist/bootstrap-cli.js /run/bootstrap/password-token
      - run: docker compose run -d --name station-password-app --no-deps -p 127.0.0.1:8082:8080 -e DB_NAME=station_password_test -e APP_ORIGIN=https://localhost:8082 app
      - run: curl --insecure --fail --silent --show-error --retry 30 --retry-delay 1 --retry-max-time 60 --retry-all-errors --connect-timeout 2 --max-time 5 https://localhost:8082/ready >/dev/null
      - run: node tests/integration/password-browser.mjs
        env:
          STATION_PASSWORD_BASE_URL: https://localhost:8082
          STATION_PASSWORD_BOOTSTRAP_PATH: .cache/bootstrap/password-token
      - run: node tests/integration/google-browser.mjs
        env:
          STATION_GOOGLE_BROWSER_BASE_URL: https://localhost:8083
          STATION_GOOGLE_BROWSER_BOOTSTRAP_PATH: .cache/bootstrap/google-browser-token
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-browser-screenshots
          path: test-results/google-browser/*.png
          if-no-files-found: ignore
      - run: docker compose run --rm -T --no-deps --user "$(id -u):$(id -g)" -v "$PWD/.cache/bootstrap:/run/bootstrap" app node apps/server/dist/bootstrap-cli.js /run/bootstrap/runtime-e2e-token
      - run: pnpm test:e2e
        env:
          STATION_E2E_BASE_URL: https://localhost:8080
          STATION_E2E_BOOTSTRAP_PATH: .cache/bootstrap/runtime-e2e-token
      - if: always()
        run: docker rm -f station-passkey-app || true
      - if: always()
        run: docker rm -f station-password-app || true
      - if: always()
        run: docker rm -f station-google-browser-app || true
      - if: always()
        run: docker compose down -v --remove-orphans
