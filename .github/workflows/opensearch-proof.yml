name: Manual OpenSearch M2 proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-engine-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @station/search check:parser && pnpm build
      - run: node tests/integration/opensearch-proof.mjs --self-test
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: bash scripts/opensearch-proof.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensearch-proof-fake-results
          path: .cache/results/opensearch-proof/*
          if-no-files-found: ignore
