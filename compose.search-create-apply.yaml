services:
  search-create-apply-transfer:
    profiles: [search-create-apply]
    build:
      context: .
      target: search-attestor
    command: ["node", "scripts/search-create-apply-transfer.mjs"]
    user: "0:0"
    volumes:
      - type: bind
        source: ./.cache/search-db/initial-v1/transition.password
        target: /run/create-apply-password/password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.cache/search-create-intent/pending.json
        target: /run/create-apply-intent/intent.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.cache/search-create-apply/binding.json
        target: /run/create-apply-binding/binding.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STATION_CREATE_APPLY_PUBLIC_ROOT:?Set STATION_CREATE_APPLY_PUBLIC_ROOT}
        target: /run/create-apply-public
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: search_create_apply_input
        target: /run/search-create-apply
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=0,gid=0,mode=0700
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    network_mode: none
    restart: "no"

  search-create-index:
    profiles: [search-create-apply]
    build:
      context: .
      target: search-attestor
    command: ["node", "scripts/search-create-apply-consumer.mjs"]
    user: "1000:1000"
    volumes:
      - type: volume
        source: search_create_apply_input
        target: /run/search-create-apply
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: search_admin_certs
        target: /run/station-admin
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: search_security_state
        target: /run/station-state
        read_only: true
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks: [search_admin_db, search_internal]
    restart: "no"

volumes:
  search_create_apply_input:
    external: true
    name: ${STATION_CREATE_APPLY_VOLUME_NAME:?Set STATION_CREATE_APPLY_VOLUME_NAME}
